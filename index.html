<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al Raza Cold Press Oil Mart | Cold-Pressed Oils, Fresh Spices & Chakki Atta</title>
    <meta name="description" content="Cold-pressed virgin oils, fresh stone-ground spices, and whole wheat chakki atta delivered with Cash on Delivery across Pakistan." />
    
    <!-- Fast DNS preconnects and CDN links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    
    <!-- Instant Eager Preloads for Above-The-Fold Assets (Logo & Hero Banner) -->
    <link rel="preload" as="image" href="./logo.webp" type="image/webp" fetchpriority="high">
    <link rel="preload" as="image" href="./hero-banner.webp" type="image/webp" fetchpriority="high">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #ffffff;
        color: #0f172a;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .font-display {
        font-family: 'Cinzel', serif;
      }
      /* Forcefully hide Vite HMR error overlay */
      vite-error-overlay {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-amber-800 selection:text-amber-100">
    <div id="root"></div>
    <!-- Suppress benign Vite HMR websocket errors in AI Studio preview -->
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && event.reason.message.includes('WebSocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      const originalConsoleError = console.error;
      console.error = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('failed to connect to websocket')) return;
        originalConsoleError.apply(console, args);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
