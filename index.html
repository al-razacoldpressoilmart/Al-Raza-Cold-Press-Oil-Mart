<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al Raza Cold Press Oil Mart | 100% Pure Mara Chekku Natural Oils</title>
    <meta name="description" content="Shop 100% pure, single-origin wood-pressed (Mara Chekku) natural oils. Cold-extracted below 38°C with zero chemicals, lab certified batches, and rich natural nutrients." />
    
    <!-- Google Fonts for artisanal serif & clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #1c1917; /* Matches obsidian-luxury-black bg-stone-900 */
        color: #f5f5f4; /* Matches text-stone-100 */
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .font-display {
        font-family: 'Cinzel', serif;
      }
      /* Forcefully hide Vite HMR error overlay */
      vite-error-overlay {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-amber-800 selection:text-amber-100">
    <div id="root"></div>
    <!-- Suppress benign Vite HMR websocket errors in AI Studio preview -->
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && event.reason.message.includes('WebSocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      const originalConsoleError = console.error;
      console.error = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('failed to connect to websocket')) return;
        originalConsoleError.apply(console, args);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
