<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Circle with border -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="128" cy="128" r="112" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  <circle cx="128" cy="128" r="90" fill="url(#glow)" />

  <!-- Artisanal Droplet Icon in Gold -->
  <g transform="translate(128, 90)">
    <!-- Droplet Body -->
    <path d="M 0,-36 C 24,0 32,18 32,32 C 32,50 18,64 0,64 C -18,64 -32,50 -32,32 C -32,18 -24,0 0,-36 Z" 
          fill="url(#goldGrad)" />
    <!-- Inner Leaf accent -->
    <path d="M 0,-16 C 10,6 16,18 16,28 C 16,36 10,42 0,44 C 6,36 6,24 0,-16 Z" 
          fill="#fef3c7" opacity="0.75" />
    <!-- Sparkle -->
    <circle cx="12" cy="14" r="3" fill="#ffffff" />
  </g>

  <!-- Circular Arch Text: AL RAZA COLD PRESS -->
  <text x="128" y="180" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">AL RAZA</text>
  <text x="128" y="198" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="3">PURE MART</text>
  <text x="128" y="214" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="1.5">COLD PRESSED • NATURAL</text>
</svg>
